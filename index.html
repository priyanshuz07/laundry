<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>FreshWash Laundry — Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202738;
      --muted: #7b8494;
      --line: #e9ecf1;
      --surface: #fff;
      --canvas: #f6f7fa;
      --brand: #3478f6;
      --brand-dark: #2464df;
      --brand-soft: #edf3ff;
      --green: #13855b;
      --green-soft: #e9f7f0;
      --amber: #ad6a17;
      --amber-soft: #fff4e4;
      --red: #c74848;
      --red-soft: #fff0ef;
      --shadow: 0 14px 42px rgb(31 45 75 / 9%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { min-width: 320px; margin: 0; color: var(--ink); background: var(--canvas); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgb(52 120 246 / 25%); outline-offset: 2px; }
    .app-shell { min-height: 100vh; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 4; display: flex; width: 244px; flex-direction: column;
      padding: 25px 15px 18px; background: #fff; border-right: 1px solid var(--line);
    }
    .brand { display: flex; align-items: center; gap: 11px; margin: 0 7px 34px; font-size: 17px; font-weight: 750; letter-spacing: -.045em; white-space: nowrap; }
    .brand-mark { display: grid; place-items: center; width: 37px; height: 37px; flex: 0 0 auto; color: white; background: var(--brand); border-radius: 12px; }
    .brand-mark svg { width: 21px; height: 21px; }
    .nav-label { margin: 0 10px 9px; color: #9aa1ad; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .nav-list { display: grid; gap: 4px; }
    .nav-link { display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 11px; border: 0; border-radius: 8px; color: #657083; background: transparent; font-size: 12px; font-weight: 560; text-align: left; transition: color .15s, background .15s; }
    .nav-link svg { width: 17px; height: 17px; flex: 0 0 auto; }
    .nav-link:hover { color: var(--brand); background: #f5f8ff; }
    .nav-link.active { color: var(--brand); background: var(--brand-soft); font-weight: 680; }
    .sidebar-bottom { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--line); }
    .shop-status { display: flex; align-items: center; gap: 9px; color: #637084; font-size: 11px; }
    .online-dot { width: 8px; height: 8px; border-radius: 50%; background: #32b17c; box-shadow: 0 0 0 3px #e4f7ef; }
    .sidebar-footnote { margin-top: 8px; color: #a0a7b3; font-size: 10px; }
    .workspace { min-height: 100vh; margin-left: 244px; }
    .topbar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 72px; padding: 0 34px; background: rgb(255 255 255 / 96%); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); }
    .topbar-business { display: none; font-size: 14px; font-weight: 700; }
    .global-search { position: relative; width: min(390px, 43vw); }
    .global-search svg { position: absolute; top: 50%; left: 13px; width: 16px; height: 16px; color: #919aaa; transform: translateY(-50%); pointer-events: none; }
    .global-search input { width: 100%; height: 39px; padding: 0 14px 0 39px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: #fafbfd; font-size: 12px; }
    .global-search input::placeholder { color: #969eab; }
    .search-results { position: absolute; top: calc(100% + 8px); left: 0; z-index: 7; width: min(440px, 85vw); max-height: min(420px, 70vh); overflow: auto; padding: 6px; border: 1px solid var(--line); border-radius: 11px; background: white; box-shadow: var(--shadow); }
    .search-results[hidden] { display: none; }
    .search-group-label { padding: 9px 10px 5px; color: #969eab; font-size: 9px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    .search-result { display: flex; align-items: center; width: 100%; gap: 10px; padding: 9px 10px; border: 0; border-radius: 8px; color: var(--ink); background: white; text-align: left; }
    .search-result:hover, .search-result:focus-visible { background: #f5f8ff; }
    .search-result-icon { display: grid; place-items: center; width: 30px; height: 30px; flex: 0 0 auto; border-radius: 9px; color: var(--brand); background: var(--brand-soft); }
    .search-result-icon svg { width: 15px; height: 15px; }
    .search-result-copy { min-width: 0; flex: 1; }
    .search-result-title { overflow: hidden; font-size: 11px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .search-result-meta { margin-top: 3px; color: #929baa; font-size: 9px; }
    .search-empty { padding: 17px 12px; color: #7b8494; font-size: 11px; text-align: center; }
    .header-right { display: flex; align-items: center; gap: 14px; }
    .date-block { text-align: right; }
    .date-label { color: #a0a7b3; font-size: 10px; }
    .today-date { margin-top: 3px; color: #505c70; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .avatar { display: grid; place-items: center; width: 34px; height: 34px; border: 0; border-radius: 50%; color: #376bd3; background: #eaf1ff; font-size: 11px; font-weight: 700; }
    .mobile-menu { display: none; }
    main { width: min(1460px, 100%); margin: 0 auto; padding: 29px 34px 45px; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 22px; }
    h1 { margin: 0 0 6px; font-size: clamp(24px, 2.6vw, 30px); letter-spacing: -.045em; }
    .page-subtitle { margin: 0; color: var(--muted); font-size: 12px; }
    .primary-button, .secondary-button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 39px; padding: 0 14px; border-radius: 8px; font-size: 11px; font-weight: 650; white-space: nowrap; }
    .primary-button { border: 1px solid var(--brand); color: white; background: var(--brand); box-shadow: 0 3px 8px rgb(52 120 246 / 17%); }
    .primary-button:hover { background: var(--brand-dark); }
    .secondary-button { border: 1px solid var(--line); color: #596579; background: white; }
    .secondary-button:hover { background: #f8f9fb; }
    .primary-button svg, .secondary-button svg { width: 15px; height: 15px; }
    .stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 13px; margin-bottom: 20px; }
    .stat-card { min-width: 0; min-height: 120px; padding: 16px 15px; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
    .stat-top { display: flex; align-items: center; justify-content: space-between; gap: 5px; color: #737e90; font-size: 10px; font-weight: 570; }
    .stat-icon { display: grid; place-items: center; width: 29px; height: 29px; flex: 0 0 auto; color: var(--brand); background: var(--brand-soft); border-radius: 9px; }
    .stat-icon svg { width: 15px; height: 15px; }
    .stat-card:nth-child(2) .stat-icon, .stat-card:nth-child(6) .stat-icon { color: var(--amber); background: var(--amber-soft); }
    .stat-card:nth-child(4) .stat-icon { color: var(--green); background: var(--green-soft); }
    .stat-card:nth-child(5) .stat-icon { color: #8158d5; background: #f3edff; }
    .stat-value { overflow: hidden; margin-top: 12px; font-size: clamp(20px, 2vw, 25px); font-weight: 730; letter-spacing: -.05em; text-overflow: ellipsis; white-space: nowrap; }
    .stat-note { overflow: hidden; margin-top: 4px; color: #9ba3b0; font-size: 9px; text-overflow: ellipsis; white-space: nowrap; }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(270px, .9fr); gap: 17px; align-items: start; }
    .left-column, .right-column { display: grid; gap: 17px; min-width: 0; }
    .panel { overflow: hidden; border: 1px solid var(--line); border-radius: 11px; background: var(--surface); }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 13px; padding: 17px 18px; }
    h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: -.02em; }
    .panel-subtitle { margin: 4px 0 0; color: #929baa; font-size: 10px; }
    .text-action { padding: 5px 0 5px 8px; border: 0; color: var(--brand); background: transparent; font-size: 10px; font-weight: 650; white-space: nowrap; }
    .text-action:hover { color: var(--brand-dark); text-decoration: underline; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    thead { background: #fafbfc; }
    th { padding: 10px 12px; color: #8992a0; font-size: 9px; font-weight: 670; letter-spacing: .055em; text-transform: uppercase; white-space: nowrap; }
    td { padding: 12px; border-top: 1px solid #eff1f4; font-size: 10px; vertical-align: middle; }
    th:first-child, td:first-child { padding-left: 18px; }
    th:last-child, td:last-child { padding-right: 18px; }
    .customer-name { color: #313b4d; font-size: 10px; font-weight: 650; white-space: nowrap; }
    .subtext { margin-top: 3px; color: #939baa; font-size: 9px; white-space: nowrap; }
    .order-number { color: #657187; font-size: 9px; font-weight: 650; white-space: nowrap; }
    .stage { display: inline-flex; align-items: center; gap: 5px; padding: 5px 7px; border-radius: 15px; font-size: 9px; font-weight: 650; white-space: nowrap; }
    .stage::before { width: 5px; height: 5px; border-radius: 50%; background: currentColor; content: ""; }
    .stage-received, .stage-washing { color: #3766c9; background: #edf2ff; }
    .stage-drying, .stage-ironing, .stage-packing { color: #a36616; background: #fff4e4; }
    .stage-ready { color: #16845b; background: #e9f7f0; }
    .stage-delivered { color: #677286; background: #f0f2f5; }
    .payment-due { color: #ac6917; font-weight: 670; white-space: nowrap; }
    .payment-clear { color: var(--green); font-weight: 630; white-space: nowrap; }
    .empty-state { padding: 34px 18px; color: var(--muted); text-align: center; }
    .empty-state h3 { margin: 8px 0 5px; color: var(--ink); font-size: 12px; }
    .empty-state p { margin: 0; font-size: 10px; line-height: 1.6; }
    .empty-icon { display: grid; place-items: center; width: 34px; height: 34px; margin: 0 auto; border-radius: 10px; color: var(--brand); background: var(--brand-soft); }
    .empty-icon svg { width: 17px; height: 17px; }
    .due-list { padding: 0 17px 7px; }
    .due-item { display: grid; grid-template-columns: 31px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid #eff1f4; }
    .due-item:first-child { border-top: 0; }
    .due-icon { display: grid; place-items: center; width: 29px; height: 29px; color: var(--amber); background: var(--amber-soft); border-radius: 9px; }
    .due-icon.overdue { color: var(--red); background: var(--red-soft); }
    .due-icon svg { width: 15px; height: 15px; }
    .due-name { overflow: hidden; font-size: 10px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .due-info { margin-top: 3px; color: #929baa; font-size: 9px; }
    .due-date { color: #9a641c; font-size: 9px; font-weight: 650; text-align: right; white-space: nowrap; }
    .due-date.overdue { color: var(--red); }
    .workflow { padding: 0 17px 17px; }
    .workflow-row { display: grid; grid-template-columns: 74px minmax(35px, 1fr) 23px; align-items: center; gap: 9px; margin-top: 14px; }
    .workflow-name { color: #616d81; font-size: 10px; }
    .workflow-track { height: 6px; overflow: hidden; border-radius: 6px; background: #f0f2f6; }
    .workflow-fill { height: 100%; min-width: 0; border-radius: inherit; background: var(--brand); transition: width .2s ease; }
    .workflow-row:nth-child(3) .workflow-fill { background: #5b83e5; }
    .workflow-row:nth-child(4) .workflow-fill { background: #f1ad4d; }
    .workflow-row:nth-child(5) .workflow-fill { background: #eb9c4f; }
    .workflow-row:nth-child(6) .workflow-fill { background: #9174de; }
    .workflow-row:nth-child(7) .workflow-fill { background: #32a577; }
    .workflow-count { color: #667287; font-size: 10px; font-weight: 650; text-align: right; }
    .profile-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
    .profile-title { display: flex; align-items: center; gap: 12px; }
    .profile-avatar { display: grid; place-items: center; width: 43px; height: 43px; flex: 0 0 auto; border-radius: 13px; color: #376bd3; background: #eaf1ff; font-size: 13px; font-weight: 750; }
    .profile-title h1 { margin-bottom: 4px; font-size: 23px; }
    .profile-contact { color: var(--muted); font-size: 11px; }
    .profile-actions { display: flex; gap: 8px; }
    .customer-info-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 0 17px 16px; }
    .info-tile { min-width: 0; padding: 11px 12px; border: 1px solid #eff1f5; border-radius: 8px; background: #fcfcfd; }
    .info-label { color: #929baa; font-size: 9px; }
    .info-value { overflow: hidden; margin-top: 5px; color: #394457; font-size: 10px; font-weight: 620; text-overflow: ellipsis; white-space: nowrap; }
    .history-filters { display: flex; flex-wrap: wrap; gap: 9px; padding: 0 17px 15px; }
    .history-filters select, .history-filters input { min-width: 140px; min-height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: 7px; color: #596579; background: white; font-size: 10px; }
    .tracking-filters { display: flex; flex-wrap: wrap; align-items: end; gap: 10px; padding: 0 17px 15px; }
    .tracking-filters .field { min-width: 145px; }
    .tracking-count { margin-left: auto; padding-bottom: 9px; color: var(--muted); font-size: 10px; }
    .rack-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); gap: 12px; padding: 0 17px 17px; }
    .rack-card { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
    .rack-card.warning { border-color: #f0c47b; background: #fffbf2; }
    .rack-card.full { border-color: #e7a1a1; background: #fff8f8; }
    .rack-card-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .rack-card-heading h3 { margin: 0; color: var(--ink); font-size: 12px; }
    .rack-capacity { margin-top: 4px; color: var(--muted); font-size: 10px; }
    .rack-warning { margin-top: 10px; color: #a45f13; font-size: 10px; font-weight: 650; }
    .rack-order { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 7px; padding: 9px 0 0; margin-top: 9px; border-top: 1px solid var(--line); }
    .rack-order-meta { min-width: 0; color: var(--muted); font-size: 9px; line-height: 1.5; }
    .rack-order-meta strong { display: block; overflow: hidden; color: var(--ink); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .rack-config-form { display: grid; grid-template-columns: minmax(120px, 1fr) 125px auto auto; align-items: end; gap: 9px; padding: 0 17px 16px; }
    .rack-config-row { display: grid; grid-template-columns: minmax(100px, 1fr) 120px auto auto auto; align-items: center; gap: 9px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
    .rack-config-row strong { overflow: hidden; color: var(--ink); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .rack-config-row input[type="number"] { width: 100%; min-height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; font-size: 10px; }
    .rack-config-row input[type="text"] { width: 100%; min-height: 34px; min-width: 0; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; font-size: 10px; }
    .rack-config-list { display: grid; gap: 9px; padding: 0 17px 17px; }
    .rack-full-toggle { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .rack-assign-form { display: flex; align-items: center; gap: 6px; }
    .rack-assign-form select { max-width: 145px; min-height: 31px; padding: 0 6px; border: 1px solid var(--line); border-radius: 6px; background: white; font-size: 9px; }
    .rack-location-result { margin: 0 17px 15px; padding: 12px 14px; border: 1px solid #dbe7ff; border-radius: 9px; color: #52627b; background: #f7faff; font-size: 10px; }
    .rack-location-result strong { color: #2e5fb8; }
    .compact-button { min-height: 31px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; color: #46536a; background: #fff; font-size: 9px; font-weight: 650; white-space: nowrap; }
    .compact-button:hover { border-color: #b8c9e9; background: #f8faff; }
    .history-items { display: grid; gap: 3px; min-width: 150px; }
    .history-item { color: #5c687c; font-size: 9px; line-height: 1.45; white-space: normal; }
    .history-item + .history-item { margin-top: 2px; }
    .history-payment { min-width: 100px; }
    .order-detail-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 17px; }
    .order-detail-heading h1 { font-size: 23px; }
    .detail-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 16px 17px; }
    .detail-item-list { display: grid; gap: 8px; padding: 0 17px 16px; }
    .detail-item-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 10px; border: 1px solid #eff1f5; border-radius: 8px; color: #58657a; font-size: 10px; }
    .timeline { display: grid; grid-template-columns: repeat(7, minmax(84px, 1fr)); gap: 0; overflow-x: auto; padding: 19px 17px 21px; }
    .timeline-step { position: relative; min-width: 84px; color: #a0a7b3; font-size: 9px; text-align: center; }
    .timeline-time { min-height: 12px; margin-top: 4px; color: #8b95a5; font-size: 8px; font-weight: 450; line-height: 1.3; }
    .stage-history-list { display: grid; gap: 7px; padding: 0 17px 17px; }
    .stage-history-label { margin-bottom: 1px; color: #58657a; font-size: 9px; font-weight: 650; }
    .stage-history-entry { display: flex; justify-content: space-between; gap: 12px; color: #626f83; font-size: 9px; }
    .stage-history-entry time { color: #929baa; text-align: right; }
    .timeline-step:not(:last-child)::after { position: absolute; top: 9px; left: calc(50% + 12px); width: calc(100% - 24px); height: 2px; background: #e9ecf1; content: ""; }
    .timeline-step.done:not(:last-child)::after { background: #6fa0ff; }
    .timeline-dot { position: relative; z-index: 1; display: grid; place-items: center; width: 19px; height: 19px; margin: 0 auto 8px; border: 2px solid #e2e6ed; border-radius: 50%; color: transparent; background: white; }
    .timeline-dot svg { width: 11px; height: 11px; }
    .timeline-step.done { color: #4168b8; font-weight: 630; }
    .timeline-step.done .timeline-dot { border-color: #3478f6; color: white; background: #3478f6; }
    .timeline-step.current { color: #2365df; }
    .timeline-step.current .timeline-dot { box-shadow: 0 0 0 4px #eaf1ff; }
    .payment-form { display: flex; align-items: flex-end; gap: 9px; padding: 0 17px 16px; }
    .payment-form .field { width: min(220px, 55%); }
    .payment-entry-form { display: grid; grid-template-columns: minmax(90px, 1fr) minmax(135px, 1fr) minmax(90px, 1fr) minmax(120px, 1fr) auto; align-items: end; gap: 9px; padding: 0 17px 16px; }
    .payment-entry-form .field input, .payment-entry-form .field select { min-height: 36px; padding: 7px 8px; font-size: 10px; }
    .payment-status { display: inline-flex; padding: 4px 8px; border-radius: 12px; font-size: 9px; font-weight: 680; white-space: nowrap; }
    .payment-status-paid { color: #16845b; background: #e9f7f0; }
    .payment-status-partial { color: #a36616; background: #fff4e4; }
    .payment-status-unpaid { color: #a63333; background: #fff0f0; }
    .payment-history { padding: 0 16px 13px; }
    .payment-history summary { color: var(--brand); cursor: pointer; font-size: 9px; font-weight: 650; }
    .payment-history-list { display: grid; gap: 6px; padding-top: 8px; }
    .payment-history-row { display: grid; grid-template-columns: minmax(95px, 1fr) minmax(80px, auto) minmax(80px, auto) minmax(80px, 1fr); gap: 8px; color: #667287; font-size: 9px; }
    .payment-row-details { min-width: 210px; }
    .payment-row-details summary { color: var(--brand); cursor: pointer; font-size: 10px; font-weight: 650; }
    .payment-row-actions { display: flex; flex-wrap: wrap; gap: 12px; padding: 0 17px 15px; }
    .payment-stats { margin-bottom: 15px; }
    .payment-summary { gap: 10px 18px; }
    .report-page-actions, .report-export-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
    .report-controls { margin-bottom: 15px; }
    .report-controls .panel-heading { align-items: center; }
    .report-date-fields { display: flex; align-items: end; flex-wrap: wrap; gap: 12px; padding: 0 17px 16px; }
    .report-date-fields .field { width: min(220px, 100%); }
    .report-date-fields .secondary-button { margin-bottom: 1px; }
    .report-error { margin: 0 17px 15px; }
    .reports-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; margin-bottom: 15px; }
    .report-section { margin-bottom: 15px; }
    .payment-export-action { display: flex; justify-content: flex-end; padding: 0 17px 12px; }
    .feedback-banner { margin-bottom: 15px; padding: 11px 14px; border: 1px solid #ccebdc; border-radius: 8px; color: #226545; background: #effaf4; font-size: 11px; }
    .receipt-print-root { display: none; }
    .payment-summary { display: flex; flex-wrap: wrap; gap: 18px; padding: 0 17px 15px; color: #667287; font-size: 10px; }
    .payment-summary strong { color: #384457; }
    .item-editor { display: grid; gap: 8px; }

  <script>
    (() => {
      "use strict";
      const STORAGE_KEY = "press-fold-orders-v1";

          return;
        }
        const values = Object.fromEntries(data.entries());
        const existing = orders.find((item) => item.id === editingId);
        const phone = String(values.phone || "").trim();
        let customer = customers.find((item) => normalizePhone(item.phone) && normalizePhone(item.phone) === normalizePhone(phone));
        if (!customer && existing) customer = customers.find((item) => item.id === existing.customerId);
        if (!customer && !normalizePhone(phone)) customer = customers.find((item) => normalizeName(item.name) === normalizeName(values.customerName));
        if (customer && customer.id !== (existing && existing.customerId)) {
          values.customerName = customer.name;
          values.phone = customer.phone;
        }
        const previousOrders = JSON.stringify(orders);
        const previousCustomers = JSON.stringify(customers);
        const previousLocations = JSON.stringify(storageLocations);
        if (!customer) {
          customer = {
            id: createId("CUS"), name: String(values.customerName).trim(), phone,
            address: "", registrationDate: receivedDate
          };
          customers.push(customer);
        }
        const newStage = stage;
        const order = {
          ...(existing || {}),
          ...values,
          id: editingId || createId("FW"),
          customerId: customer.id,
          customerName: customer.name,
          phone: customer.phone,
          address: customer.address,
          items: items.map((item) => ({ ...item, lineTotal: roundMoney(item.quantity * item.unitPrice) })),
          quantity,
          service: items[0].service,
          stage: existing ? existing.stage : newStage,
          total,
          subtotal: existing ? existing.subtotal : total,
          discount: existing ? existing.discount : 0,
          taxPercent: existing ? existing.taxPercent : 0,
          taxAmount: existing ? existing.taxAmount : 0,
          advance,
          payments: existing ? existing.payments : [],
          paid: advance + (existing ? orderPaymentsTotal(existing) : 0),
          paymentMethod: existing ? existing.paymentMethod : "Cash",
          washingInstructions: existing ? existing.washingInstructions : "",
          stageHistory: existing ? [...existing.stageHistory] : [{ stage: newStage, timestamp: new Date().toISOString() }],
          storageLocation: newStage === "Delivered" ? "" : String(values.rack || ""),
          actualDeliveryDate: stage === "Delivered" ? (actualDeliveryDate || existing && existing.actualDeliveryDate || localDate()) : (actualDeliveryDate || existing && existing.actualDeliveryDate || ""),
          receivedDate,
          deliveryDate
        };
        if (existing && newStage !== existing.stage) transitionOrderStage(order, newStage);
        orders = editingId ? orders.map((item) => item.id === editingId ? order : item) : [order, ...orders];
        reconcileCustomers(customers);
        storageLocations = normalizeStorageLocations(storageLocations);
        if (!saveOrders()) {
          orders = JSON.parse(previousOrders);
          customers = JSON.parse(previousCustomers);
          storageLocations = JSON.parse(previousLocations);
          return;
        }
        closeModal();
        render();
        renderSearchResults(globalSearch.value.trim());
      });
      pageContent.addEventListener("submit", (event) => {
        const addLocationForm = event.target.closest("#rack-add-form");
        if (addLocationForm) {
          event.preventDefault();
          const data = new FormData(addLocationForm);
          const name = String(data.get("name") || "").trim();
          const rawCapacity = String(data.get("capacity") || "").trim();
          const capacity = rawCapacity ? Number(rawCapacity) : null;
          if (!name || (capacity !== null && (!Number.isInteger(capacity) || capacity < 1 || capacity > 100000))) {
            window.alert("Enter a location name and a whole-number capacity from 1 to 100,000, or leave capacity blank for unlimited.");
            return;
          }
          if (storageLocations.some((location) => location.name.toLocaleLowerCase() === name.toLocaleLowerCase())) {
            window.alert("A storage location with that name already exists.");
            return;
          }
          const previousLocations = JSON.stringify(storageLocations);
          storageLocations = normalizeStorageLocations([...storageLocations, { name, capacity, isFull: false }]);
          if (!saveOrders()) {
            storageLocations = JSON.parse(previousLocations);
            return;
          }
          render();
          return;
        }
        const locationForm = event.target.closest("[data-order-location-form]");
        if (locationForm) {
          event.preventDefault();
          const order = orders.find((item) => item.id === locationForm.dataset.orderLocationForm);
          const name = String(new FormData(locationForm).get("location") || "");
          const location = storageLocations.find((item) => item.name === name);
          const error = locationForm.parentElement.querySelector("[data-assignment-error]");
          error.textContent = "";
          error.classList.remove("visible");
          if (!order || (name && !location)) return;
          if (location && !canAssignLocation(location, order)) {
            error.textContent = location.isFull ? "This location is marked full. Clear its full flag or choose another location."
              : "This assignment would exceed the location's clothing capacity.";
            error.classList.add("visible");
            return;
          }
          const previousOrders = JSON.stringify(orders);
          order.storageLocation = name;
          if (name) order.rack = name;
          if (!saveOrders()) {
            orders = JSON.parse(previousOrders);
            return;
          }
          feedbackMessage = `Order #${order.id} location updated${name ? ` to ${name}` : ""}.`;
          render();
          return;
        }
        const customerForm = event.target.closest("#customer-info-form");
        if (customerForm) {
          event.preventDefault();
          const customer = customers.find((item) => item.id === customerForm.dataset.id);
          if (!customer) return;
          const data = new FormData(customerForm);
          const name = String(data.get("name") || "").trim();
          const phone = String(data.get("phone") || "").trim();
          const normalizedPhone = normalizePhone(phone);
          const duplicate = normalizedPhone && customers.find((item) => item.id !== customer.id && normalizePhone(item.phone) === normalizedPhone);
          const error = document.getElementById("customer-form-error");
          if (duplicate) {
            error.textContent = "That mobile number is already linked to another customer. Update that customer record instead to avoid duplicates.";
            error.classList.add("visible");
            return;
          }
          if (!name) {
            error.textContent = "Enter the customer's full name.";
            error.classList.add("visible");
            return;
          }
          const previousOrders = JSON.stringify(orders);
          const previousCustomers = JSON.stringify(customers);
          customer.name = name;
          customer.phone = phone;
          customer.address = String(data.get("address") || "").trim();
          orders.forEach((order) => {
            if (order.customerId === customer.id) {
              order.customerName = customer.name;
              order.phone = customer.phone;
              order.address = customer.address;
            }
          });
          reconcileCustomers(customers);
          if (!saveOrders()) {
            orders = JSON.parse(previousOrders);
            customers = JSON.parse(previousCustomers);
            return;
          }
          feedbackMessage = `Customer information for ${customer.name} was saved.`;
          render();
          renderSearchResults(globalSearch.value.trim());
          return;
        }
        const paymentForm = event.target.closest("[data-payment-form]");
        if (!paymentForm) return;
        event.preventDefault();
        const order = orders.find((item) => item.id === paymentForm.dataset.id);
        const data = new FormData(paymentForm);
        const amount = roundMoney(Number(data.get("amount")));
        const date = String(data.get("date") || "");
        const method = String(data.get("method") || "");
        const reference = String(data.get("reference") || "").trim();
        const error = paymentForm.querySelector("[data-payment-error]");
        if (error) {
          error.textContent = "";
          error.classList.remove("visible");
        }
        let message = "";
        if (!order) message = "This order could not be found. Refresh the page and try again.";
        else if (!Number.isFinite(amount) || amount <= 0) message = "Enter a payment amount greater than zero.";
        else if (amount > dueBalance(order)) message = `Payment exceeds the outstanding balance of ${formatMoney(dueBalance(order))}.`;
        else if (!date || Number.isNaN(new Date(`${date}T00:00:00`).getTime())) message = "Choose a valid payment date.";
        else if (!["Cash", "UPI", "Card"].includes(method)) message = "Choose Cash, UPI, or Card as the payment method.";
        else if (reference.length > 80) message = "Transaction reference must be 80 characters or fewer.";
        if (message) {
          if (error) {
            error.textContent = message;
            error.classList.add("visible");
          } else {
            window.alert(message);
          }
          return;
        }
        const previousOrders = JSON.stringify(orders);
        order.payments.push({ amount, date, method, reference });
        order.paid = orderPaid(order);
        if (!saveOrders()) {
          orders = JSON.parse(previousOrders);
          return;
        }
        feedbackMessage = `Payment of ${formatMoney(amount)} recorded for order #${order.id}.`;
        render();
      });
      document.getElementById("close-modal").addEventListener("click", closeModal);
      document.getElementById("cancel-modal").addEventListener("click", closeModal);
      modal.addEventListener("click", (event) => { if (event.target === modal) closeModal(); });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && !modal.hidden) closeModal();
        if (event.key === "Escape") closeSidebar();
      });
      document.getElementById("delete-order").addEventListener("click", () => {
        const order = orders.find((item) => item.id === editingId);
        if (!order || !window.confirm(`Delete order #${order.id} for ${order.customerName}? This cannot be undone.`)) return;
        const previousOrders = orders;
        orders = orders.filter((item) => item.id !== editingId);
        if (!saveOrders()) { orders = previousOrders; return; }
        closeModal();
        render();
      });
      document.getElementById("mobile-menu").addEventListener("click", () => {
        const sidebar = document.getElementById("sidebar");
        const open = !sidebar.classList.contains("open");
        sidebar.classList.toggle("open", open);
        document.getElementById("mobile-scrim").classList.toggle("visible", open);
        document.getElementById("mobile-menu").setAttribute("aria-expanded", String(open));
      });
      document.getElementById("mobile-scrim").addEventListener("click", closeSidebar);

      orders = loadOrders();
      render();
    })();
  </script>
</body>
</html>
